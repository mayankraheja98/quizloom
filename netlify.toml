[build]
  base    = "frontend"
  command = "npm install && npm run build"
  publish = "dist"

# Proxy /api/* → Railway backend.
# Set BACKEND_URL in Netlify → Site configuration → Environment variables
# e.g. BACKEND_URL = https://quizloom-backend.up.railway.app
[[redirects]]
  from   = "/api/*"
  to     = "${BACKEND_URL}/:splat"
  status = 200
  force  = true

# SPA fallback — all other routes serve index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
